name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required for docs showLastUpdateTime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Check external links
        uses: lycheeverse/lychee-action@v2.3.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: >-
            --config .lychee.toml
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
